<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Angry Bird - Muh. Alif Fadilah</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="angry-bird.css">
</head>
<body>
<div class="card wide ab-page">
  <div class="dash-header">
    <h1>🎈 ketapel</h1>
    <a href="../../pages/game.html" class="btn btn-keluar">← Kembali</a>
  </div>

  <div class="ab-stats">
    <span>Skor: <b id="abScore">0</b></span>
    <span>Burung tersisa: <b id="abBirds">3</b></span>
  </div>

  <div class="ab-canvas-wrap">
    <canvas id="abCanvas"></canvas>
    <div id="abOverlay" class="ab-overlay hidden">
      <p id="abOverlayText"></p>
      <button id="abRestartBtn" class="btn btn-shuffle">Main Lagi</button>
    </div>
  </div>

  <p class="ab-hint">Klik &amp; tarik burung dari ketapel, lalu lepaskan untuk menembak bangunan.</p>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script src="angry-bird.js"></script>
</body>
</html>
